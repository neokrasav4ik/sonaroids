# Publishes the site to GitHub Pages (sonaroids.app) on every push to main.
# The lab checks run first: if they fail, nothing is published.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lab checks
        run: |
          cd lab
          python3 build.py --check
          sh tools/run_all.sh

      - name: Game checks
        run: sh tests/run.sh

      - name: Assemble the site
        run: |
          mkdir -p _site/lab
          cp -r game/. _site/
          cp lab/app/sonar_lab3.html _site/lab/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
