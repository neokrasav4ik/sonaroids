# Publishes the site to GitHub Pages (sonaroids.app): on every push to main and after «Unpack uploaded zip».
# 7 Oct (Den: «сделай чтоб на гитхабе воркфлоу сайт быстрее собирал.. а то там каждый раз много действий которые уже не нужны»):
# only copy and publish — the game (game/play/index.html) and the lab (lab/app/sonar_lab3.html) come already built in the zip,
# and the checks are run before every zip. The long checks moved to «Checks» (by hand). The artifact keeps the standard name
# «github-pages» (a custom name broke the deploy on 7 Oct: «No artifacts named github-pages-1»). If a deploy fails, start the
# workflow anew (Run workflow) instead of «Re-run»: a re-run finds two «github-pages» artifacts in one run.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/lab
          cp -r game/. _site/
          cp lab/app/sonar_lab3.html _site/lab/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
