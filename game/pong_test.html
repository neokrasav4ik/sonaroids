<style>

:root{ --paper:#f6f1e6; --ink:#1f1d24; --soft:#6d665c; --line:#cfc6b4; --accent:#c8452c;

body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--hand); overflow:hidden; display:flex; flex-direction:column; }
#stage{ flex:1; min-height:0; }
canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }

.seg{ display:flex; gap:2px; }

button[aria-pressed="true"]{ color:var(--ink); box-shadow:inset 0 0 0 1.6px var(--ink); }
button:focus-visible{ outline:2px dashed var(--accent); outline-offset:2px; }
.hint{ font-size:19px; color:var(--soft); }
</style>
<div id="stage"><canvas id="cv" aria-label="Набросок SonaPong: два человечка играют в бадминтон на платформах"></canvas></div>
<div class="bar">
  <div class="seg" role="group" aria-label="Чем нарисовано">
    <button id="ink-liner" data-ink="liner" aria-pressed="true">линер</button>
    <button id="ink-pen" data-ink="pen" aria-pressed="false">шариковая ручка</button>
    <button id="ink-wash" data-ink="wash" aria-pressed="false">тушь и акварель</button>
  </div>
  <button id="boil" aria-pressed="true">линии дрожат</button>
  <span class="hint" id="hint">телефон лучше повернуть</span>
</div>
<script>
/* Hand-drawn pen on sketchbook paper — a canvas 2D toolkit (prototype for SonaPong's look).

Pen.prototype.stroke=function(pts,o={}){ const c=this.c, P=resample(pts,1.2), n=P.length; if(n<2) return;

<script>
(function(){
const W=844,H=390, CEIL=22, G=900;

    p.line(X(11),y-52*k,X(14),y-60*k,{over:1}); p.loop(X(16.5),y-68*k,5*k,8*k,{rot:d*0.3}); }
  else { p.draw([[X(0.5),y-35*k],[X(8),y-30*k],[X(13),y-34*k]]); p.draw([[X(0.5),y-35*k],[X(-6),y-28*k],[X(-8),y-22*k]]);
    p.line(X(13),y-34*k,X(17),y-41*k,{over:1}); p.loop(X(19.5),y-48.5*k,5*k,8*k,{rot:d*0.5}); }
  if(pose!=='run'){ p.line(X(legs[0][2]-3),y-1*k,X(legs[0][2]+3),y-1*k,{over:1,w:p.w*0.9}); p.line(X(legs[1][2]),y-1*k,X(legs[1][2]+6),y-1*k,{over:1,w:p.w*0.9}); } }
function shuttle(p,x,y,a,o={}){ const c=Math.cos(a), s=Math.sin(a), R=(u,v)=>[x+u*c-v*s,y+u*s+v*c], k=o.k||1;
  p.loop(...R(0,0),3.3*k,3.3*k,{ink:o.cork,w:p.w*1.1});
  p.line(...R(-3*k,-2.4*k),...R(-15*k,-7*k),{over:1}); p.line(...R(-3*k,2.4*k),...R(-15*k,7*k),{over:1});
  p.draw([R(-15*k,-7*k),R(-16.5*k,-2*k),R(-16.5*k,3*k),R(-15*k,7*k)]); p.line(...R(-3.5*k,0),...R(-15.5*k,0.5*k),{over:0.5,w:p.w*0.6,a:0.7}); }
function platform(p,i,wk){ const P=i?PR:PL, [t0,t1]=span(i,wk), m=p.rnd(0.42,0.58), top=curve(P,t0,t1,80);
  p.draw(curve(P,t0,t0+(t1-t0)*(m+0.04),40),{w:p.w*1.35}); p.draw(curve(P,t0+(t1-t0)*(m-0.04),t1,40),{w:p.w*1.35});
  const bot=top.map(([x,y],j)=>[x,y+13*(0.6+0.4*Math.sin(Math.PI*j/(top.length-1)))]);
  p.draw(bot.filter((v,j)=>j%2===0),{w:p.w*0.7,a:0.75}); p.band(top,bot,{sp:4.2,shift:-3,w:p.w*0.55});
  p.line(top[0][0],top[0][1],bot[0][0],bot[0][1],{over:2,w:p.w*0.8}); const e=top.length-1; p.line(top[e][0],top[e][1],bot[e][0],bot[e][1],{over:2,w:p.w*0.8}); }
function ceiling(p){ p.line(12,CEIL+1,440,CEIL-1,{w:p.w*1.2,over:6}); p.line(410,CEIL-1.5,834,CEIL+1.5,{w:p.w*1.2,over:6});
  const top=[], bot=[]; for(let x=0;x<=W;x+=2){ top.push([x,CEIL-0.5]); bot.push([x,CEIL-8-6*Sk.noise(x/40)-p.rnd(0,3)]); } p.band(top,bot,{sp:6,shift:4,w:p.w*0.5,a:0.65}); }
function hudStatic(p){ p.line(16,13,46,12,{over:2,w:p.w*0.8}); p.line(46,12,47,42,{over:2,w:p.w*0.8}); p.line(47,42,15,43,{over:2,w:p.w*0.8}); p.line(15,43,16,12,{over:2,w:p.w*0.8});
  p.line(26,20,26,35,{w:p.w*1.4,over:1}); p.line(36,20,36,35,{w:p.w*1.4,over:1});
  p.text('sonaroids.app',16,378,13,{w:p.w*0.7,a:0.75});
  p.line(352,366,492,365,{over:2,w:p.w*0.8}); p.line(352,376,492,376,{over:2,w:p.w*0.8}); p.line(352,366,351,376,{over:1,w:p.w*0.8}); p.line(492,365,493,376,{over:1,w:p.w*0.8}); }
function hudDyn(p,S,ac){ p.text(String(S.score).replace(/\B(?=(\d{3})+(?!\d))/g,' '),828,46,26,{align:'right',w:p.w*1.25});
  p.text('×'+S.mult.toFixed(1).replace('.',','),828,70,14,{align:'right',w:p.w*0.9,ink:ac});
  let x=822; for(let i=0;i<5;i++){ p.loop(x,371,3.6,3.6,{w:p.w*0.8}); if(i<S.series) p.draw([[x-2.5,373],[x+2,368],[x-1.5,372],[x+2.5,370]],{w:p.w*1.4,ink:ac}); x-=13; } x-=12;
  for(let i=0;i<S.lives;i++){ shuttle(p,x,371,-Math.PI/2,{k:0.62,cork:ac}); x-=16; }
  const bw=Math.max(4,140*S.wk), t2=[], b2=[]; for(let xx=422-bw/2+1;xx<=422+bw/2-1;xx+=1){ t2.push([xx,375]); b2.push([xx,367]); } p.band(t2,b2,{sp:2.6,shift:3,w:p.w*0.7,a:0.9,ink:ac}); }

/* ── canvas, paper and the cached still parts (three «boil» copies each) ── */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'); let dpr=1, cw=0, ch=0, sc=1, ox=0, oy=0, paperCv=null, stat=[], statKey='', sprites=null;
function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function resize(){ dpr=Math.min(2,window.devicePixelRatio||1); const r=cv.getBoundingClientRect(), st=document.getElementById('stage').getBoundingClientRect(); cw=Math.max(200,r.width); ch=Math.max(120,r.height); cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  const fh=Math.max(100,st.bottom-st.top), ft=st.top; sc=Math.min(cw/W,fh/H); ox=(cw-W*sc)/2; oy=ft+(fh-H*sc)/2;
  paperCv=mk(cv.width,cv.height); const pc=paperCv.getContext('2d'); pc.scale(dpr,dpr); Sk.paper(pc,cw,ch,dpr,{seed:7});
  statKey=''; document.getElementById('hint').hidden=cw>ch; }
const field=c=>c.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);
function washBand(c,i,wk){ const P=i?PR:PL, [t0,t1]=span(i,wk), t=curve(P,t0+0.01,t1-0.01,60).map(([x,y])=>[x+4,y-3]), b=curve(P,t0+0.01,t1-0.01,60).reverse().map(([x,y],j)=>[x+4,y+17*(0.6+0.4*Math.sin(Math.PI*j/60))]); Sk.washPoly(c,t.concat(b),'rgba(95,150,80,A)',{a:0.16,amp:3,seed:7+i}); }
function buildStatic(wk){ const I=INKS[inkKey]; stat=[];
  for(let v=0;v<3;v++){ const c=mk(cv.width,cv.height), x=c.getContext('2d'); x.drawImage(paperCv,0,0);
    if(I.wash){ field(x); washBand(x,0,wk); washBand(x,1,wk); Sk.wash(x,420,14,420,12,'rgba(120,120,135,A)',{a:0.08,amp:3,grain:600,seed:3}); x.setTransform(1,0,0,1,0,0); }
    const L=mk(cv.width,cv.height), lc=L.getContext('2d'); field(lc); const p=new Sk.Pen(lc,{seed:101+v*37,ink:I.ink,w:I.w,wob:I.wob,passes:I.passes,jit:I.jit});
    ceiling(p); platform(p,0,wk); platform(p,1,wk); hudStatic(p);
    Sk.lay(x,L,0,0,{dry:I.dry?Math.round(L.width*L.height/45):0,alpha:0.95}); stat.push(c); }
  sprites=null; if(I.wash){ sprites=[0,1,2].map(v=>{ const mkw=(rx,ry,col,a)=>{ const s=Math.ceil((Math.max(rx,ry)*2+12)*dpr*sc), c=mk(s,s), x=c.getContext('2d'); x.setTransform(dpr*sc,0,0,dpr*sc,s/2,s/2); Sk.wash(x,0,0,rx,ry,col,{a,seed:11+v*5}); return c; };
    return {red:mkw(8,10,'rgba(215,75,55,A)',0.28),blue:mkw(8,10,'rgba(55,105,195,A)',0.26),glow:mkw(13,10,'rgba(245,190,40,A)',0.22)}; }); } }
function sprite(img,x,y){ ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(img,dpr*(ox+x*sc)-img.width/2,dpr*(oy+y*sc)-img.height/2); ctx.restore(); }

/* ── a rally that plays itself ── */
const S={score:0,mult:1,lives:5,series:0,wk:1,pass:0,t:0,nextNarrow:14,pops:[],crumbs:[]};
const pl=[{x:150,tx:150,d:1,pose:'ready',sw:0,cap:false,hair:true},{x:690,tx:690,d:-1,pose:'ready',sw:0,cap:true}];
let sh=null, wait=0.8, server=0;
function contact(i,x){ return [x+pl[i].d*16,yAt(i,x)-62]; }
function launch(from){ const to=1-from, [lo,hi]=xRange(to,S.wk), miss=S.pass>3&&Math.random()<0.1;
  let xr=miss?(to?lo-38-Math.random()*20:hi+38+Math.random()*20):lo+22+Math.random()*(hi-lo-44);
  const [x0,y0]=contact(from,pl[from].x), yt=miss?y0:contact(to,Math.max(lo+10,Math.min(hi-10,xr)))[1], xt=xr+pl[to].d*16;
  const r=Math.random(), lowY=Math.min(y0,yt)-55, ya=r<0.18?CEIL+7+Math.random()*6:CEIL+20+Math.random()*(lowY-CEIL-20)*Math.pow(Math.random(),0.7);
  const vy=-Math.sqrt(2*G*(y0-ya)), tu=-vy/G, td=Math.sqrt(2*(yt-ya)/G), T=tu+td;
  sh={x0,y0,vx:(xt-x0)/T,vy,t:0,T,to,miss,ya,popped:false,fall:false};
  pl[to].tx=Math.max(lo+10,Math.min(hi-10,xr)); pl[from].pose='swing'; pl[from].sw=0.28; }
function shPos(t){ return [sh.x0+sh.vx*t,sh.y0+sh.vy*t+0.5*G*t*t]; }
function step(dt){ S.t+=dt;
  if(S.t>S.nextNarrow&&S.wk>0.52){ const old=S.wk; S.wk*=0.875; S.nextNarrow=S.t+14; S.mult=Math.min(2,1+(1-S.wk)*2); statKey='';
    [0,1].forEach(i=>{ const P=i?PR:PL; for(let k=0;k<7;k++){ const t=i?S.wk+(old-S.wk)*Math.random():(1-old)+(old-S.wk)*Math.random(), p=q(P,t); S.crumbs.push({x:p[0],y:p[1]+4,vx:(i?1:-1)*(10+Math.random()*30),vy:-20-Math.random()*40,r:Math.random()*6,vr:(Math.random()-0.5)*6,s:3+Math.random()*4,seed:Math.floor(Math.random()*1e6)}); } });
    pl.forEach((P,i)=>{ const [lo,hi]=xRange(i,S.wk); P.x=Math.max(lo+10,Math.min(hi-10,P.x)); P.tx=Math.max(lo+10,Math.min(hi-10,P.tx)); }); }
  S.crumbs.forEach(c=>{ c.vy+=G*0.6*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.r+=c.vr*dt; }); S.crumbs=S.crumbs.filter(c=>c.y<H+20);
  S.pops.forEach(p=>p.t+=dt); S.pops=S.pops.filter(p=>p.t<1.2);
  pl.forEach(P=>{ const dx=P.tx-P.x, v=Math.sign(dx)*Math.min(Math.abs(dx),220*dt); P.x+=v; P.moving=Math.abs(dx)>1.5; if(P.sw>0){ P.sw-=dt; P.pose='swing'; } else P.pose=P.moving?'run':'ready'; });
  if(!sh){ wait-=dt; if(wait<=0) launch(server); return; }
  sh.t+=dt; const [x,y]=shPos(sh.t);
  if(!sh.popped&&sh.vy+G*sh.t>=0){ sh.popped=true; const fr=Math.max(0,Math.min(1,(270-sh.ya)/(270-CEIL))), pts=Math.round((fr<0.7?40*fr*fr*fr/0.343:40+260*Math.pow((fr-0.7)/0.3,2))*S.mult); S.score+=pts; S.pops.push({x,y:sh.ya-10,pts,t:0,near:sh.ya<CEIL+14}); }
  if(!sh.miss&&sh.t>=sh.T){ S.pass++; S.series=Math.min(5,S.series+1); const from=sh.to; pl[from].x=pl[from].tx; launch(from); return; }
  if(sh.miss&&y>H+30){ S.lives--; S.series=0; server=sh.to; sh=null; wait=1.1;
    if(S.lives<=0){ S.lives=5; S.score=0; S.wk=1; S.mult=1; S.pass=0; S.nextNarrow=S.t+14; statKey=''; pl[0].x=pl[0].tx=150; pl[1].x=pl[1].tx=690; wait=1.6; } } }

function frame(now){ const dt=Math.min(0.05,(now-(frame.l||now))/1000); frame.l=now; if(!reduce) step(dt);
  const I=INKS[inkKey], key=inkKey+':'+S.wk.toFixed(4)+':'+cw+'x'+ch; if(statKey!==key){ buildStatic(S.wk); statKey=key; }
  const tick=boilOn&&!reduce?Math.floor(now/125):0, v=tick%3;
  ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='source-over'; ctx.drawImage(stat[v],0,0);
  if(sprites){ const sp=sprites[v]; sprite(sp.red,pl[0].x+pl[0].d*3,yAt(0,pl[0].x)-36); sprite(sp.blue,pl[1].x+pl[1].d*3,yAt(1,pl[1].x)-36); if(sh){ const [x,y]=shPos(sh.t); sprite(sp.glow,x+3,y); } }
  field(ctx); ctx.globalCompositeOperation='multiply';
  const p=new Sk.Pen(ctx,{seed:1+tick*13,ink:I.ink,w:I.w,wob:I.wob,passes:I.passes,jit:I.jit});
  pl.forEach((P,i)=>player(p,P.x,yAt(i,P.x),P.d,P.pose,{hair:P.hair,cap:P.cap,step:Math.floor(now/110)%2}));
  if(sh){ const [x,y]=shPos(sh.t), vy=sh.vy+G*sh.t, a=Math.atan2(vy,sh.vx);
    const pts=[]; for(let t=0;t<=sh.t;t+=1/400) pts.push(shPos(t)); let acc=0, on=false, seg=[]; const n=pts.length;
    for(let k=1;k<n-12;k++){ acc+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]); if(acc>(on?5:7)){ acc=0; if(on&&seg.length>1) p.stroke(seg,{w:p.w*(0.45+0.5*k/n),a:0.3+0.6*k/n,wob:0.3}); on=!on; seg=[]; } if(on) seg.push(pts[k]); }
    shuttle(p,x,y,a,{cork:I.accent,k:1.3}); }
  S.crumbs.forEach(c=>{ const cp=new Sk.Pen(ctx,{seed:c.seed+tick,ink:I.ink,w:I.w*0.8,wob:0.4}); const s=c.s, cs=Math.cos(c.r), sn=Math.sin(c.r), R=(u,w)=>[c.x+u*cs-w*sn,c.y+u*sn+w*cs]; cp.draw([R(-s,-s),R(s,-s),R(s,s),R(-s,s),R(-s,-s*0.8)]); cp.stroke([R(-s*0.6,s*0.6),R(s*0.6,-s*0.6)],{w:I.w*0.5}); });
  S.pops.forEach(o=>{ const pp=new Sk.Pen(ctx,{seed:o.pts+tick,ink:I.accent,w:I.w*1.05,wob:0.6}); pp.text('+'+o.pts,o.x,o.y-o.t*18+(o.near?0:0),o.near?20:15,{align:'center',a:Math.max(0,1-o.t/1.2)}); });
  hudDyn(p,S,I.accent);
  ctx.globalCompositeOperation='source-over'; requestAnimationFrame(frame); }

/* ── switches ── */
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function sync(){ document.querySelectorAll('[data-ink]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ink===inkKey))); const bb=document.getElementById('boil'); bb.setAttribute('aria-pressed',String(boilOn)); bb.textContent=boilOn?'линии дрожат':'линии замерли'; }
document.querySelectorAll('[data-ink]').forEach(b=>b.addEventListener('click',()=>{ inkKey=b.dataset.ink; statKey=''; try{ localStorage.setItem('sk-ink',inkKey); }catch(e){} sync(); }));
document.getElementById('boil').addEventListener('click',()=>{ boilOn=!boilOn; try{ localStorage.setItem('sk-boil',boilOn?'1':'0'); }catch(e){} sync(); });
window.addEventListener('resize',()=>{ clearTimeout(resize.t); resize.t=setTimeout(resize,120); });
const start=()=>{ resize(); sync(); requestAnimationFrame(frame); };
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(start,start); else start();
})();
</script>
