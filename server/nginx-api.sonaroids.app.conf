# nginx in front of the leaderboard server (when nginx already holds ports 80/443 — then Caddy is not needed).
# Install: sudo cp server/nginx-api.sonaroids.app.conf /etc/nginx/sites-available/api.sonaroids.app
#          sudo ln -s /etc/nginx/sites-available/api.sonaroids.app /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d api.sonaroids.app   (certbot adds HTTPS here)
server {
    listen 80;
    listen [::]:80;
    server_name api.sonaroids.app;
    client_max_body_size 300k;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the real player address, for the rate limits
    }
}
